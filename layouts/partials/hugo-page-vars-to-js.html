{{- $logicalName := "" -}}
{{- with .File -}}{{- $logicalName = .LogicalName -}}{{- end -}}
{{- $currentParams := merge .Params (dict "title" .Title "logicalName" $logicalName) -}}
<script type="text/javascript">
  let pageVars = {};
  pageVars.pageUrlMinusBasePath = ("{{.RelPermalink}}".replace(basePath, "/")).replace(/\/+/g, "/");
  pageVars.pageParams = JSON.parse("{{ $currentParams | jsonify }}");
  pageVars.pageSource = "{{ with .File }}{{.Path}}{{ end }}";
  console.log(pageVars.pageSource);
  var pageDefaults = {};
  for (let possiblePageDefaults of pageDefaultsList) {
    if (pageVars.pageSource.startsWith(possiblePageDefaults.scope.pathPrefix)) {
      pageDefaults = possiblePageDefaults.values;
    }
  }
    // console.debug(pageParams);
</script>
