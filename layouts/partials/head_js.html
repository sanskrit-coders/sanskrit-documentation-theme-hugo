<script src="{{ relURL "webpack_dist/uiLib-bundle.js" }}"></script>

{{ $jsExtras := .Params.js_extras | default .Site.Params.js_extras }}

{{ if and $jsExtras (in $jsExtras "mathjax") }}
<script>
    MathJax = {
        tex: {
            inlineMath: [ ["@#", "#@"], ["\\(", "\\)"] ],
            displayMath: [ ["$$","$$"], ["\\[", "\\]"] ],
            processEscapes: true,  // use \$ to produce a literal dollar sign
        },
        svg: {
            fontCache: 'global'
        },
        options: {
            ignoreHtmlClass: "tex2jax_ignore|dno"
        }
    };
</script>
<script type="text/javascript" id="MathJax-script" async
        src="{{ relURL "non_webpack_js/mathjax/tex-svg.js" }}">
</script>
{{ end }}

{{ if and $jsExtras (in $jsExtras "mermaid") }}
<script src="{{ relURL "non_webpack_js/mermaid.min.js" }}"></script>
<script>
    mermaid.initialize({ startOnLoad: true });
</script>
{{ end }}

{{ if and $jsExtras (in $jsExtras "leaflet") }}
<link rel="stylesheet" href="{{ relURL "non_webpack_js/leaflet.css" }}" />
<script src="{{ relURL "non_webpack_js/leaflet.js" }}"></script>
<script src="{{ relURL "non_webpack_js/leaflet-kmz.js" }}"></script>
{{ end }}
